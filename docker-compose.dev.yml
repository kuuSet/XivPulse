services:
  rust-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        RUST_IMAGE: ${XIVPULSE_RUST_IMAGE:-rust:1.85-slim-bookworm}
    init: true
    working_dir: /workspace/rust
    command: ["sleep", "infinity"]
    environment:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /cargo-target
      XIVPULSE_ARXIV_CATEGORIES: cs.RO,cs.AI,cs.CV,cs.LG
      XIVPULSE_FETCH_LIMIT: "2000"
    volumes:
      - .:/workspace
      - xivpulse-cargo-registry:/usr/local/cargo/registry
      - xivpulse-cargo-git:/usr/local/cargo/git
      - xivpulse-cargo-target:/cargo-target
    cpus: 2.0
    mem_limit: 2g

volumes:
  xivpulse-cargo-registry:
  xivpulse-cargo-git:
  xivpulse-cargo-target:
