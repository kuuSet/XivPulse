services:
  xivpulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: xivpulse:server
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      XIVPULSE_DATA_DIR: /app/data
      XIVPULSE_HOST: 0.0.0.0
      XIVPULSE_PORT: 8765
      XIVPULSE_AUTH_ENABLED: "true"
      XIVPULSE_AUTH_SECURE_COOKIES: "true"
      XIVPULSE_AUTH_TRUST_PROXY: "true"
      XIVPULSE_SEMANTIC_BACKFILL_ENABLED: "true"
    expose:
      - "8765"
    volumes:
      - xivpulse-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  scheduler:
    image: xivpulse:server
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.docker_scheduler"]
    env_file:
      - .env.server
    environment:
      XIVPULSE_DATA_DIR: /app/data
      XIVPULSE_AUTH_ENABLED: "true"
      XIVPULSE_SEMANTIC_BACKFILL_ENABLED: "false"
    volumes:
      - xivpulse-data:/app/data
    depends_on:
      xivpulse:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file:
      - .env.server
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.server:/etc/caddy/Caddyfile:ro
      - xivpulse-caddy-data:/data
      - xivpulse-caddy-config:/config
    depends_on:
      xivpulse:
        condition: service_healthy

volumes:
  xivpulse-data:
  xivpulse-caddy-data:
  xivpulse-caddy-config:
